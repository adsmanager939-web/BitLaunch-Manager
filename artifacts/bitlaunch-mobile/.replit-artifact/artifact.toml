kind = "mobile"
previewPath = "/bitlaunch-mobile/"
title = "BitLaunch Mobile"
description = "Mobile companion app for monitoring BitLaunch infrastructure on the go. Shows account balance, server/image/volume counts, a live server list with status badges, server detail view, and a snapshot status poller."
version = "1.0.0"
id = "artifacts/bitlaunch-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/bitlaunch-mobile/" ]
localPort = 20038

[services.development]
run = "pnpm --filter @workspace/bitlaunch-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bitlaunch-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bitlaunch-mobile", "run", "serve" ]

[services.env]
PORT = "20038"
BASE_PATH = "/bitlaunch-mobile/"
